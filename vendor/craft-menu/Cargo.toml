[package]
name = "craft-menu"
description = "A Craft app's menus: layouts for macOS, Windows, Linux and the web, shortcuts from craft-keymap, a macOS backend, and key equivalents fed back to egui."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[dependencies]
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb", default-features = false, features = ["egui"] }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb", features = ["egui"] }
egui = { version = "0.37", default-features = false }

# Already in the apps' Cargo.lock: muda through craft-quit's `menu` feature, objc2 and objc2-app-kit
# through eframe.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }

[dev-dependencies]
# `default_fonts` so that the bar's tests lay out text.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

[lints.rust]
unsafe_code = "forbid"
