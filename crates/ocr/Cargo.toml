[package]
name = "pdfcraft-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-fonts = { workspace = true }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26.0", default-features = false, features = ["onnx_format", "rten_format"] }
rten-imageproc = "0.26.0"
# Lion PDF's engine: PP-OCR tensors and its page images.
rten-tensor = "0.26.0"
image = { version = "0.25", default-features = false }
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The page image is handed to the external tesseract process as a PNG.
craft-image-codecs = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
