# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Pin shared workflows; review suite-wide changes with each fork integration.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@86bc2ce420c548d7b171874b67814217532a1648
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
