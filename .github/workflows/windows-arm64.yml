# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

# Nightly on main and on pushes to `release` (dependency and runner-image drift shows up within a
# day, and always before a release ships), and on PRs that change the Windows packaging itself.
on:
  schedule:
    - cron: "43 5 * * *"
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    if: github.event_name != 'schedule' || github.repository == 'storytold/pdfcraft'
    # Pin shared workflows; review suite-wide changes with each fork integration.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385
    with:
      app-name: pdfcraft
      app-dir: PdfCraft
